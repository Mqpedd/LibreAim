name: macOS build

# Builds the macOS app on every pull request, and publishes it to the
# "latest" release on every push to main. The in-game updater reads that
# release (see scenes/autoload/updater.gd).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

env:
  GODOT_VERSION: 4.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-macos

      - name: Install Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          templates="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p ~/godot "$templates"
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -jq /tmp/templates.tpz templates/macos.zip templates/version.txt -d "$templates"
          rm /tmp/godot.zip /tmp/templates.tpz

      - name: Write build id
        run: printf '[build]\nid="%s"\n' "$GITHUB_SHA" > build_info.cfg

      - name: Export macOS app
        run: |
          mkdir -p _exports/macos
          ~/godot/godot --headless --import || true
          ~/godot/godot --headless --export-release "macOS" _exports/macos/LibreAim.zip
          test -s _exports/macos/LibreAim.zip
          mv _exports/macos/LibreAim.zip LibreAim-macOS.zip
          echo "$GITHUB_SHA" > build_id.txt

      - uses: actions/upload-artifact@v4
        with:
          name: LibreAim-macOS
          path: LibreAim-macOS.zip

      - name: Publish latest release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push -f origin "$GITHUB_SHA:refs/tags/latest"
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "Latest macOS build" --notes ""
          # Upload the app before the build id, so the game never sees a new
          # id while the old app is still attached.
          gh release upload latest LibreAim-macOS.zip --clobber
          gh release upload latest build_id.txt --clobber
          gh release edit latest --notes "Built from $GITHUB_SHA"
